[application]
id = blur
name = Blur
executable = Z:\data\JkFlow\Blur\Blur.exe
working_directory = Z:\data\JkFlow\Blur
dll_overrides = d3d9=n
runtime = wine-wow64
architecture = pe32
graphics = dxvk
[display]
desktop = 1920x1080
scaling = fit
show_fps = false
[input]
mode = xinput
options = escape
[runtime]
fast_clock = true
cpu = native
[env]
PW_NATIVE_ALERT_UMTX = 1
DXVK_PS4_NATIVE = menu
PW_SERVER_PRIO = 699
DXVK_PS4_NET_CACHE = 3
[dxvk.conf]
d3d9.maxFrameLatency = 1
d3d9.maxFrameRate = 60
